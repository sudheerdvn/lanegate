name: CI

on:
  push:
    branches: [main]

# Windows' default text encoding (cp1252/mbcs) isn't UTF-8, so any open()/
# write_text()/read_text() without an explicit encoding= -- including the
# many ASCII-only test fixtures that never needed to think about it -- falls
# back to it there. PYTHONUTF8=1 makes UTF-8 the default everywhere, matching
# what real users get from the CLI's own _force_utf8_output() reconfiguration
# (lanegate/cli.py) but covering internal functions tests call directly.
env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Ruff check (advisory)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: ruff check lanegate tests ci

      - name: File-size ratchet
        shell: bash
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            python scripts/check_file_size.py --against origin/main
          else
            python scripts/check_file_size.py --absolute
          fi

      - name: Run tests
        if: runner.os != 'Windows'
        run: python ci/run_pytest.py

      - name: Run tests
        if: runner.os == 'Windows'
        shell: cmd
        run: python ci/run_pytest.py

      # Advisory only — surfaces type errors without blocking merges while the
      # existing codebase gets typed incrementally. Ratchet to blocking once
      # the backlog is clear.
      - name: Type check (advisory)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: python -m mypy lanegate

  smoke-windows:
    name: Windows runtime smoke (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e .[dev]

      # Unmocked end-to-end exercise of the OS boundaries the unit suite mocks/skips:
      # detached spawn (CREATE_NEW_PROCESS_GROUP), os.kill SIGTERM (TerminateProcess),
      # the os.kill liveness probe, portalocker flock, and a real `lanegate init` run.
      - name: Run runtime smoke test
        shell: cmd
        run: python ci/smoke_windows.py

  release-smoke:
    name: Release artifact smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build frontend
        run: python -m pip install build

      - name: Build, install, and exercise the release artifact
        run: python ci/smoke_release.py
